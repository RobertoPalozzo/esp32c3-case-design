name: Backup Automatico su Google Drive

on:
  push:
    branches: [ main ] # Cambia in "master" se il tuo ramo principale si chiama così

jobs:
  upload-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Comprimi il sito in un archivio zip
        run: zip -r esp32-site-backup.zip . -x "*.git*"

      - name: Carica il file zip su Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: 'esp32-site-backup.zip'
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: true

name: Backup Automatico su Google Drive

on:
  push:
    branches: [ main ]

jobs:
  upload-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Comprimi il sito in un archivio zip
        run: zip -r backup.zip . -x "*.git*"

      - name: Installa librerie Google
        run: pip install google-api-python-client google-auth

      - name: Carica su Google Drive tramite Python
        shell: python
        env:
          GDRIVE_CREDENTIALS_RAW: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # 1. Carica le credenziali direttamente come JSON integro
          creds_json = json.loads(os.environ['GDRIVE_CREDENTIALS_RAW'])
          
          # 2. Autenticazione
          SCOPES = ['https://googleapis.com', 'https://googleapis.com']
          creds = service_account.Credentials.from_service_account_info(creds_json, scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          # 3. Configura il file di destinazione
          file_metadata = {
              'name': 'backup.zip',
              'parents': [os.environ['GDRIVE_FOLDER_ID']]
          }
          media = MediaFileUpload('backup.zip', mimetype='application/zip')
          
          # 4. Esegui il caricamento
          print("Inizio caricamento su Google Drive...")
          file = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
          print(f"Backup completato con successo! File ID: {file.get('id')}")
